<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskPanda | Connect with skilled local tradespeople</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link href="/dist/output.css" rel="stylesheet" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Poppins', ui-sans, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
  </style>
</head>
<body class="bg-primary-50 text-primary-900 antialiased">
  <header class="fixed inset-x-0 top-0 z-30 bg-white/80 backdrop-blur-md shadow-sm">
    <div class="container mx-auto flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="index.html" class="text-2xl font-extrabold tracking-tight text-primary-700">
        TaskPanda
      </a>
    </div>
  </header>

  <main class="container mx-auto grid min-h-screen grid-cols-1 items-center gap-8 pt-24 pb-16 md:pt-28 lg:grid-cols-2 lg:gap-12 lg:py-20 xl:pt-32">
    <section class="flex flex-col items-center justify-center gap-10 text-center lg:items-start lg:text-left xl:gap-12">
      <div>
        <h1 class="font-extrabold leading-tight tracking-tight text-primary-900 text-4xl sm:text-4xl md:text-5xl xl:text-6xl">
          Connect with skilled<br class="hidden sm:block" />local tradespeople
        </h1>
        <p class="mt-6 max-w-md text-lg/relaxed text-primary-600 md:text-xl">
          TaskPanda bridges local homeowners and independent mechanics,
          plumbers, electricians, etc. with AI-quick matching.
        </p>
      </div>

      <div
        class="relative flex aspect-square w-64 shrink-0 items-center justify-center rounded-full bg-white/80 shadow-xl ring-1 ring-black/5 sm:w-72 sm:aspect-video sm:rounded-3xl"
      >
        <img
          src="/assets/mascot.svg"
          alt="TaskPanda mascot"
          class="h-48 w-48 sm:h-56 sm:w-56"
        />
      </div>
    </section>

    <section class="flex justify-center px-4 lg:px-0">
      <div class="w-full max-w-md space-y-8 rounded-2xl bg-white p-8 shadow-xl ring-1 ring-black/5">
        <div class="space-y-2 text-center">
          <h2 class="font-bold text-3xl text-primary-800">Welcome Back</h2>
          <p class="text-sm text-primary-500">
            Sign in to continue to your TaskPanda account
          </p>
        </div>

        <form action="/login" method="POST" class="mt-8 space-y-5">
          <div class="space-y-2">
            <label for="email" class="block text-sm font-medium text-primary-700">
              Email or Username
            </label>
            <input
              type="email"
              id="email"
              name="email"
              autocomplete="username"
              required
              placeholder="hello@example.com"
              class="block w-full rounded-lg border border-primary-200 bg-primary-50/50 px-4 py-3 text-base text-primary-900 placeholder-primary-400/70 transition-colors focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
            />
          </div>

          <div class="space-y-2">
            <label for="password" class="block text-sm font-medium text-primary-700">
              Password
            </label>
            <input
              type="password"
              id="password"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              class="block w-full rounded-lg border border-primary-200 bg-primary-50/50 px-4 py-3 text-base text-primary-900 placeholder-primary-400/70 transition-colors focus:border-primary-500 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
            />
          </div>

          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center gap-2 text-sm text-primary-600">
              <input
                id="remember"
                name="remember"
                type="checkbox"
                class="h-4 w-4 rounded border-primary-300 text-primary-600 focus:ring-primary-500"
              />
              Remember me
            </label>
            <a
              href="#"
              class="text-sm font-medium text-primary-600 hover:text-primary-800"
              >Forgot password?</a
            >
          </div>

          <button
            type="submit"
            class="w-full rounded-lg bg-gradient-to-r from-primary-600 to-primary-700 py-3 px-4 font-semibold text-white transition-opacity hover:brightness-110 focus:outline-none focus:ring-2 focus:ring-primary-500/40 focus:ring-offset-2"
          >
            Login
          </button>
        </form>

        <div class="mt-6 flex items-center gap-3 text-sm text-primary-400">
          <span class="h-px flex-1 bg-primary-200"></span>
          <span>Or continue with</span>
          <span class="h-px flex-1 bg-primary-200"></span>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <button
            type="button"
            class="inline-flex items-center justify-center gap-2 rounded-lg border border-primary-200 bg-white px-4 py-2.5 text-sm font-medium text-primary-800 transition-colors hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
          >
            <svg
              class="h-5 w-5"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="#4285F4"
                d="M22.54 10.12h-.01V9H12v6h5.72c-.36 2.12-1.72 3.87-3.62 4.65l-.01.01A7.94 7.94 0 0 0 12 23c3.22 0 6.14-1.54 7.89-3.89a11.34 11.34 0 0 0 2.65-7.99Z"
              />
              <path
                fill="#34A853"
                d="M12 2C8.28 2 5.25 4.58 4.25 8.49a8.94 8.94 0 0 0 0 7.02 8.82 8.82 0 0 0 2.73 3.34l.01-.01A7.92 7.92 0 0 0 12 22c1.87 0 3.63-.64 4.98-1.71l.01-.01-.67-.53A6.52 6.52 0 0 1 12 20a8 8 0 0 1-7.73-9.54 8.07 8.07 0 0 1 3.93-4.94l.01.01A7.92 7.92 0 0 1 12 4c1.86 0 3.6.66 4.95 1.72l.01-.01-.67.53A6.52 6.52 0 0 0 14.45 4z"
              />
            </svg>
            Google
          </button>
          <button
            type="button"
            class="inline-flex items-center justify-center gap-2 rounded-lg border border-primary-200 bg-white px-4 py-2.5 text-sm font-medium text-primary-800 transition-colors hover:bg-primary-50 focus:outline-none focus:ring-2 focus:ring-primary-500/30"
          >
            <svg
              class="h-5 w-5"
              fill="#1877F2"
              viewBox="0 0 24 24"
            >
              <path
                d="M22.675 0h-21.35C.57 0 0 .59 0 1.326v21.348C0 23.41.57 24 1.325 24H12.82v-9.294H9.692V11.01h3.128V8.414c0-3.1 1.894-4.788 4.66-4.788 1.325 0 2.466.099 2.797.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.312h3.587l-.467 3.696h-3.12V24h6.116c.75 0 1.325-.59 1.325-1.326V1.326C24 .59 23.41 0 22.675 0Z"
              />
            </svg>
            Facebook
          </button>
        </div>

        <div class="text-center text-sm text-primary-500">
          Don&apos;t have an account?
          <a
            href="register.html"
            class="font-medium text-primary-600 hover:text-primary-800"
            >Register</a
          >
        </div>
      </div>
    </section>
  </main>
</body>
</html>
